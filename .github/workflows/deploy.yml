name: Deploy OpenLex PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/openlex/"

      - name: Download Scholar Lexicon Asset
        run: |
          mkdir -p build/web/assets/db/
          curl -L -o build/web/assets/db/lexicon_700k.db.gz \
            "https://github.com/hiteshharidevan-NoCode5/openlex/releases/download/v1.0.1/lexicon_700k.db.gz"
          cp assets/db/version.json build/web/assets/db/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
