name: openlex
description: "OpenLex — The Lightweight, Dual-Tier Offline Lexicon"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  url_launcher: ^6.3.0
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_tts: ^3.8.3
  speech_to_text: ^6.3.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  sqflite_common_ffi_web: ^0.4.5+4
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/db/simple_dict.db

flutter_launcher_icons:
  android: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0f172a"
    theme_color: "#0f172a"
